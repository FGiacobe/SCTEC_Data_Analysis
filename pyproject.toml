[project]
name = "sctec"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
]

[tool.uv.workspace]
members = [
  "packages/*"
]

[tool.uv.sources]
elections = { workspace = true}
miniproject = { workspace = true}

# Configuration for RUFF formatter
[tool.ruff]
target-version = "py314"
fix = false
fix-only = false
indent-width = 4
line-length = 120
respect-gitignore = true
src = ["src"]
extend-exclude = []

[tool.ruff.analyze]
detect-string-imports = true
string-imports-min-dots = 2

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
preview = true
select = ["I", "E", "N", "W", "F", "W", "PL", "PT", "UP", "DOC", "D", "DJ"]
extend-ignore = ["PLR2004", "PLR6301", "D105", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true

# Configuration for Pylint tool, disable all messages compatible with RUFF
[tool.pylint.main]
ignore = ["migrations", "settings.py", "asgi.py", "wsgi.py", "manage.py"]
load-plugins = ["pylint_django"]
django-settings-module = "core.settings"

[tool.pylint.messages_control]
disable = ["C", "R", "W", "E"]