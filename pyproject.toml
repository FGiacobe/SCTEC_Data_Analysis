[project]
name = "sctec"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["miniproject", "openpyxl>=3.1.5", "pandas>=3.0.6", "rich"]

[dependency-groups]
dev = ["ipykernel", "ipywidgets"]

[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
elections = { workspace = true }
miniproject = { workspace = true }
mercadinho = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py314"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "T201", "INP001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
# line-ending = "lf"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.14.7"
include = ["packages"]
exclude = [
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "packages" }]
reportMissingTypeStubs = true
stubPath = "stubs"
